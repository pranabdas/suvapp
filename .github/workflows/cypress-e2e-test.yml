name: Cypress E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    permissions:
      contents: read

    strategy:
      # when one test fails, DO NOT cancel the others
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        browser: ["chrome", "firefox"]
        include:
          - os: "macos-latest"
            browser: "electron"
          - os: "ubuntu-latest"
            browser: "chromium"
          - os: "windows-latest"
            browser: "edge"
        exclude:
          - os: "macos-latest"
            browser: "firefox"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Node environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Clear npm cache (Windows)
        if: runner.os == 'Windows'
        run: npm cache clean --force

      - name: Cypress run
        uses: cypress-io/github-action@4ce68f262a3888d22cf3175d62010a145ba737ee # v7.4.8
        with:
          browser: ${{ matrix.browser }}
          install-command: bash plotly-custom-build.sh
          start: npm start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 300
